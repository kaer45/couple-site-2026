server:
  port: 8080

spring:
  application:
    name: couple-backend
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/couple?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true}
    username: ${SPRING_DATASOURCE_USERNAME:root}
    password: ${SPRING_DATASOURCE_PASSWORD:123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
  servlet:
    multipart:
      max-file-size: 200MB
      max-request-size: 250MB

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto


# JWT 配置（HS256，默认有效期 7 天）
jwt:
  secret: ${JWT_SECRET:change-me-to-a-long-random-string-at-least-32-chars}
  expiration: ${JWT_EXPIRATION:604800000}

# 文件上传目录
upload:
  dir: ${UPLOAD_DIR:./uploads}

# CORS 允许来源（逗号分隔）
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
