# ============================================================
# 前端 Nginx 配置：托管 SPA + 反向代理后端 API / 上传文件 / WebSocket
# 容器内 backend 主机名对应 docker-compose 中的 backend 服务
# ============================================================
server {
    listen 80;
    server_name _;

    # 上传限制需覆盖后端上限（后端：单文件 200MB、单请求 250MB，视频场景）
    client_max_body_size 250m;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退：所有路径都交给 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # AI 助手 SSE 流式接口：必须关闭代理缓冲，否则增量文本会被攒着一次性下发
    # 该 location 前缀更长，nginx 会优先于下方 /api/ 命中
    location /api/agent/chat {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 300s;
    }

    # 后端 API 反向代理
    location /api/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket 聊天通道（/ws/chat）：必须转发 Upgrade 头并放宽长连接超时
    location /ws/ {
        proxy_pass http://backend:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # 上传文件静态访问
    location /uploads/ {
        proxy_pass http://backend:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
