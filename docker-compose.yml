# ============================================================
# 双人情侣互动网站 - Docker Compose 编排
# 服务: mysql(8.0) + backend(Spring Boot) + frontend(Nginx)
#       + qdrant(向量库) + neo4j(知识图谱) —— 后两个供 Python Agent 使用
# 使用: cp .env.example .env 并修改密钥，然后
#       docker compose up -d --build
# 访问: http://服务器IP/  (前端 80 端口)
#
# 说明：Python Agent 服务本身 **不在本编排内**（见 docs/deploy.md §3.1），
#       它跑在宿主机上，通过 host.docker.internal:8001 被 backend 访问。
#       这里只负责把它的两个外部依赖起起来。
# ============================================================
services:
  mysql:
    image: mysql:8.0
    container_name: couple-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-couple}
      MYSQL_USER: ${MYSQL_USER:-couple}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - ./data/mysql:/var/lib/mysql
      # 首次启动自动执行建表脚本（仅空库时执行）
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-p${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # 向量库：Python Agent 的 /v1/ingest 与检索依赖它
  # 一个 namespace 一个 collection（见 docs/agent-api.md §6）
  # 默认无鉴权：仅监听本机时无需 API Key，勿把 6333 暴露到公网
  # ============================================================
  qdrant:
    image: qdrant/qdrant:latest
    container_name: couple-qdrant
    restart: unless-stopped
    volumes:
      - ./data/qdrant:/qdrant/storage
    ports:
      - "6333:6333"   # REST
      - "6334:6334"   # gRPC

  # ============================================================
  # 知识图谱：供 Python Agent 的实体/关系抽取使用
  # 注：Agent 侧图谱功能尚未实现（见 docs/agent-service-build-guide.md §4 第 9 步），
  #     现在起起来只是把基础设施准备好，不影响其余功能
  # ============================================================
  neo4j:
    image: neo4j:5
    container_name: couple-neo4j
    restart: unless-stopped
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD}
      TZ: Asia/Shanghai
    volumes:
      - ./data/neo4j:/data
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt（Agent 连这个）

  backend:
    build: ./backend
    container_name: couple-backend
    restart: unless-stopped
    environment:
      SPRING_DATASOURCE_URL: jdbc:mysql://mysql:3306/${MYSQL_DATABASE:-couple}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
      SPRING_DATASOURCE_USERNAME: ${MYSQL_USER:-couple}
      SPRING_DATASOURCE_PASSWORD: ${MYSQL_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-604800000}
      UPLOAD_DIR: /data/uploads
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # AI Agent（Python）集成：默认关闭，需在 .env 显式开启并保证 AGENT_URL 可达
      AGENT_ENABLED: ${AGENT_ENABLED:-false}
      AGENT_URL: ${AGENT_URL:-http://host.docker.internal:8001}
      AGENT_KEY: ${AGENT_KEY:-change-me}
      TZ: Asia/Shanghai
    # 让容器内可通过 host.docker.internal 访问宿主机上的 Python Agent（Linux 需要此映射）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./data/uploads:/data/uploads
    depends_on:
      mysql:
        condition: service_healthy
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    container_name: couple-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "80:80"
